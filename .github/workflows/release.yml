name: Release NuGet Packages via OSS Exit Gate

on:
  push:
    tags:
      - 'v*'
      - 'Google.Cloud.Functions.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Clean up stale releases from staging repo
        run: |
          # clean up stale releases from staging repo
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="functions-framework-dotnet--nuget" \
              --format="value(name)" 2>/dev/null)

          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="\'"oss-exit-gate-prod"\'" \
                  --location="\'"us"\'" \
                  --repository="\'functions-framework-dotnet--nuget\'" \
                  --quiet
          '

      - name: Build, pack, and stage NuGet packages to OSS Exit Gate
        shell: bash
        run: |
          shopt -s nullglob
          ./build.sh
          for nupkg in nupkg/*.nupkg; do
            [[ "$nupkg" == *.symbols.nupkg ]] && continue
            base="$(basename "$nupkg" .nupkg)"
            ver="$(echo "$base" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$')"
            pkg_id="${base%.$ver}"
            pkg_lower="$(echo "$pkg_id" | tr '[:upper:]' '[:lower:]')"
            gcloud artifacts generic upload \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository="functions-framework-dotnet--nuget" \
              --package="${pkg_lower}" \
              --version="${ver}" \
              --source="${nupkg}"
          done
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/functions-framework-dotnet/nuget/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
